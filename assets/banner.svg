<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Amit Verma, Senior Frontend Developer. UI/UX designer turned React and Next.js engineer.">
<title>Amit Verma, Senior Frontend Developer</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3ECFC"/><stop offset="1" stop-color="#DDCDF3"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8E7B0"/><stop offset=".5" stop-color="#E4B84F"/><stop offset="1" stop-color="#F8E7B0"/></linearGradient>
  <radialGradient id="orb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#D9BFFA"/><stop offset="1" stop-color="#7C3AED"/></radialGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#5B2A9E" flood-opacity=".22"/></filter>
  <clipPath id="clip"><rect width="1280" height="560" rx="56"/></clipPath>
</defs>
<style>
  text{font-family:Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
  .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;white-space:pre}
  .b1{animation:d1 14s ease-in-out infinite alternate}
  .b2{animation:d2 17s ease-in-out infinite alternate}
  .b3{animation:d3 15s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(90px,-50px)}}
  @keyframes d2{to{transform:translate(-110px,60px)}}
  @keyframes d3{to{transform:translate(-80px,-60px)}}
  .cursor{animation:mv 9s ease-in-out infinite}
  @keyframes mv{0%,30%{transform:translate(0,0)}55%,85%{transform:translate(90px,190px)}100%{transform:translate(0,0)}}
  .caret{animation:bl 1.1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.b1,.b2,.b3,.cursor,.caret{animation:none}}
</style>
<g clip-path="url(#clip)">
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle class="b1" cx="140" cy="430" r="150" fill="#B78CEF" opacity=".75"/>
    <circle class="b2" cx="700" cy="110" r="170" fill="#C9A7F5" opacity=".7"/>
    <circle class="b3" cx="1100" cy="500" r="190" fill="#A774E8" opacity=".55"/>
  </g>

  <!-- identity chip -->
  <g transform="translate(64,56)">
    <rect width="262" height="60" rx="30" fill="#fff" opacity=".92"/>
    <circle cx="30" cy="30" r="20" fill="#EADDFB"/>
    <text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#5B2A9E">AV</text>
    <text x="64" y="28" font-size="20" font-weight="700" fill="#5B2A9E">Amit Verma</text>
    <text x="64" y="48" font-size="15" fill="#5A5470">Kota, India</text>
  </g>

  <!-- gold pill -->
  <g transform="translate(64,132)">
    <rect width="300" height="48" rx="24" fill="url(#gold)"/>
    <text x="26" y="32" font-size="20" fill="#7A4A0B">&#9733;</text>
    <text x="54" y="32" font-size="20" font-weight="700" fill="#4A2E08">5 years of experience</text>
  </g>

  <!-- headline -->
  <text x="62" y="262" font-size="76" font-weight="800" letter-spacing="-3" fill="#14151F">Senior Frontend</text>
  <text x="62" y="342" font-size="76" font-weight="800" letter-spacing="-3" fill="#5B2A9E">Developer</text>
  <text x="64" y="392" font-size="24" fill="#4A4560">I design interfaces in Figma, then build</text>
  <text x="64" y="424" font-size="24" fill="#4A4560">them in React and Next.js.</text>

  <!-- tags -->
  <g font-size="20" font-weight="600" fill="#5B2A9E" text-anchor="middle">
    <rect x="64" y="466" width="92" height="44" rx="22" fill="#fff" opacity=".85"/><text x="110" y="495">UI/UX</text>
    <rect x="166" y="466" width="92" height="44" rx="22" fill="#fff" opacity=".85"/><text x="212" y="495">React</text>
    <rect x="268" y="466" width="114" height="44" rx="22" fill="#fff" opacity=".85"/><text x="325" y="495">Next.js</text>
    <rect x="392" y="466" width="148" height="44" rx="22" fill="#fff" opacity=".85"/><text x="466" y="495">TypeScript</text>
  </g>

  <!-- figma-style canvas -->
  <g filter="url(#shadow)">
    <rect x="740" y="96" width="400" height="250" rx="28" fill="#fff" opacity=".92"/>
  </g>
  <text x="772" y="138" font-size="15" font-weight="600" fill="#7C3AED">Hero  1280 &#215; 720</text>
  <rect x="772" y="152" width="336" height="170" rx="6" fill="#F6F0FD" stroke="#7C3AED" stroke-width="1.5"/>
  <g fill="#fff" stroke="#7C3AED" stroke-width="1.5">
    <rect x="768" y="148" width="8" height="8"/><rect x="1104" y="148" width="8" height="8"/>
    <rect x="768" y="318" width="8" height="8"/><rect x="1104" y="318" width="8" height="8"/>
  </g>
  <rect x="796" y="176" width="190" height="18" rx="9" fill="#14151F"/>
  <rect x="796" y="202" width="130" height="18" rx="9" fill="#5B2A9E"/>
  <rect x="796" y="236" width="230" height="8" rx="4" fill="#CDBBE6"/>
  <rect x="796" y="252" width="180" height="8" rx="4" fill="#CDBBE6"/>
  <rect x="796" y="276" width="100" height="30" rx="15" fill="#5B2A9E"/>
  <rect x="906" y="276" width="84" height="30" rx="15" fill="none" stroke="#5B2A9E" stroke-width="1.5"/>
  <circle cx="1062" cy="215" r="32" fill="url(#orb)"/>
  <circle cx="1088" cy="262" r="14" fill="url(#gold)"/>

  <!-- code card -->
  <g filter="url(#shadow)">
    <rect x="860" y="300" width="380" height="210" rx="24" fill="#14151F"/>
  </g>
  <circle cx="888" cy="328" r="5" fill="#5A5470"/><circle cx="906" cy="328" r="5" fill="#5A5470"/><circle cx="924" cy="328" r="5" fill="#5A5470"/>
  <text x="1216" y="333" text-anchor="end" font-size="15" fill="#9A92B5" class="m">Hero.tsx</text>
  <g class="m" font-size="17" fill="#EDE6F8" xml:space="preserve">
    <text x="888" y="378"><tspan fill="#C9A7F5">export function</tspan> <tspan fill="#F6E3A8">Hero</tspan>() {</text>
    <text x="908" y="408"><tspan fill="#C9A7F5">return</tspan> (</text>
    <text x="929" y="438"><tspan fill="#C9A7F5">&lt;h1&gt;</tspan>Design, then build.<tspan fill="#C9A7F5">&lt;/h1&gt;</tspan></text>
    <text x="908" y="468">)</text>
    <text x="888" y="498">}</text>
  </g>
  <rect class="caret" x="902" y="484" width="9" height="19" fill="#C9A7F5"/>

  <!-- cursor -->
  <g transform="translate(1066,226)">
    <g class="cursor">
      <path d="M0 0 L0 26 L7 20 L12 32 L17 30 L12 18 L21 18 Z" fill="#14151F" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
      <rect x="18" y="30" width="66" height="30" rx="15" fill="#7C3AED"/>
      <text x="51" y="51" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Amit</text>
    </g>
  </g>
</g>
</svg>
