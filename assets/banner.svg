<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Amit Verma, Senior Frontend Developer. UI/UX designer turned frontend engineer working in React, Next.js and TypeScript.">
<title>Amit Verma, Senior Frontend Developer</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F1FC"/><stop offset="1" stop-color="#E4D7F6"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3A1A6E" flood-opacity=".18"/></filter>
  <clipPath id="clip"><rect width="1280" height="440" rx="12"/></clipPath>
  <clipPath id="pc"><rect x="716" y="60" width="500" height="320" rx="8"/></clipPath>
</defs>
<style>
  text{font-family:Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
  .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;white-space:pre}
  .b1{animation:d1 16s ease-in-out infinite alternate}
  .b2{animation:d2 19s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(80px,-40px)}}
  @keyframes d2{to{transform:translate(-90px,50px)}}
  .cur{animation:mv 9s ease-in-out infinite}
  @keyframes mv{0%,25%{transform:translate(0,0)}55%,85%{transform:translate(150px,60px)}100%{transform:translate(0,0)}}
  .caret{animation:bl 1.1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.b1,.b2,.cur,.caret{animation:none}}
</style>
<g clip-path="url(#clip)">
  <rect width="1280" height="440" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle class="b1" cx="120" cy="400" r="150" fill="#B78CEF" opacity=".55"/>
    <circle class="b2" cx="620" cy="60" r="160" fill="#C9A7F5" opacity=".5"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="439" rx="11.5" fill="none" stroke="#CDBBE6"/>

  <text x="64" y="96" font-size="22" font-weight="600" fill="#5B2A9E">Amit Verma</text>
  <text x="64" y="206" font-size="68" font-weight="700" letter-spacing="-2.5" fill="#14151F">Senior Frontend</text>
  <text x="64" y="278" font-size="68" font-weight="700" letter-spacing="-2.5" fill="#14151F">Developer</text>
  <text x="64" y="330" font-size="22" fill="#4A4560">UI/UX designer turned frontend engineer.</text>
  <text x="64" y="360" font-size="21" fill="#4A4560">Building React and Next.js products for 5K to 50K+ users.</text>
  <g font-size="17" font-weight="600" fill="#5B2A9E" text-anchor="middle">
    <rect x="64.5" y="386.5" width="88" height="34" rx="4" fill="#fff" fill-opacity=".6" stroke="#B9A2E0"/><text x="108" y="409">React</text>
    <rect x="162.5" y="386.5" width="98" height="34" rx="4" fill="#fff" fill-opacity=".6" stroke="#B9A2E0"/><text x="211" y="409">Next.js</text>
    <rect x="270.5" y="386.5" width="120" height="34" rx="4" fill="#fff" fill-opacity=".6" stroke="#B9A2E0"/><text x="330" y="409">TypeScript</text>
    <rect x="400.5" y="386.5" width="88" height="34" rx="4" fill="#fff" fill-opacity=".6" stroke="#B9A2E0"/><text x="444" y="409">Figma</text>
  </g>

  <!-- design | code panel -->
  <g filter="url(#sh)"><rect x="716" y="60" width="500" height="320" rx="8" fill="#fff"/></g>
  <g clip-path="url(#pc)">
    <rect x="716" y="60" width="250" height="320" fill="#FFFFFF"/>
    <rect x="716" y="60" width="250" height="38" fill="#F3EDFB"/>
    <text x="736" y="85" font-size="14" font-weight="600" fill="#5B2A9E">Hero.fig</text>
    <rect x="966" y="60" width="250" height="320" fill="#14151F"/>
    <rect x="966" y="60" width="250" height="38" fill="#1C1E2D"/>
    <text x="986" y="85" font-size="14" font-weight="600" fill="#C9B8EC">Hero.tsx</text>
    <line x1="966.5" y1="60" x2="966.5" y2="380" stroke="#CDBBE6"/>
  </g>
  <!-- design side -->
  <rect x="740.5" y="132.5" width="202" height="168" fill="#FAF7FE" stroke="#7C3AED" stroke-width="1.2"/>
  <g fill="#fff" stroke="#7C3AED" stroke-width="1.2">
    <rect x="737" y="129" width="7" height="7"/><rect x="939" y="129" width="7" height="7"/>
    <rect x="737" y="297" width="7" height="7"/><rect x="939" y="297" width="7" height="7"/>
  </g>
  <rect x="760" y="156" width="130" height="14" rx="2" fill="#14151F"/>
  <rect x="760" y="178" width="92" height="14" rx="2" fill="#5B2A9E"/>
  <rect x="760" y="210" width="150" height="7" rx="2" fill="#CDBBE6"/>
  <rect x="760" y="225" width="118" height="7" rx="2" fill="#CDBBE6"/>
  <rect x="760" y="252" width="78" height="26" rx="3" fill="#5B2A9E"/>
  <text x="742" y="326" font-size="13" fill="#7C3AED">Hero  1280 &#215; 720</text>
  <!-- code side -->
  <g class="m" font-size="14" fill="#EDE6F8" xml:space="preserve">
    <text x="986" y="140"><tspan fill="#C9A7F5">export function</tspan> <tspan fill="#F6E3A8">Hero</tspan>() {</text>
    <text x="1003" y="168"><tspan fill="#C9A7F5">return</tspan> (</text>
    <text x="1020" y="196"><tspan fill="#C9A7F5">&lt;h1&gt;</tspan></text>
    <text x="1037" y="224">Design, then build.</text>
    <text x="1020" y="252"><tspan fill="#C9A7F5">&lt;/h1&gt;</tspan></text>
    <text x="1003" y="280">)</text>
    <text x="986" y="308">}</text>
  </g>
  <rect class="caret" x="997" y="294" width="8" height="17" fill="#C9A7F5"/>
  <!-- cursor -->
  <g transform="translate(884,238)"><g class="cur">
    <path d="M0 0 L0 22 L6 17 L10 27 L14 25.5 L10 15.5 L18 15.5 Z" fill="#14151F" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="14" y="26" width="52" height="24" rx="4" fill="#7C3AED"/>
    <text x="40" y="43" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Amit</text>
  </g></g>
</g>
</svg>
