<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Good design earns attention. Good engineering earns trust. Let's build something useful.">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A1A6E"/><stop offset=".6" stop-color="#5B2A9E"/><stop offset="1" stop-color="#8A4FD6"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8E7B0"/><stop offset=".5" stop-color="#E4B84F"/><stop offset="1" stop-color="#F8E7B0"/></linearGradient>
<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<clipPath id="c"><rect width="1280" height="330" rx="56"/></clipPath>
</defs>
<style>text{font-family:Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif} .o{animation:f 12s ease-in-out infinite alternate} @keyframes f{to{transform:translate(-70px,30px)}} @media (prefers-reduced-motion:reduce){.o{animation:none}}</style>
<g clip-path="url(#c)">
<rect width="1280" height="330" fill="url(#g)"/>
<g filter="url(#bl)"><circle class="o" cx="1120" cy="90" r="150" fill="#C9A7F5" opacity=".55"/><circle cx="980" cy="330" r="120" fill="#E4B84F" opacity=".25"/></g>
<text x="72" y="128" font-size="56" font-weight="800" letter-spacing="-2" fill="#fff">Good design earns attention.</text>
<text x="72" y="196" font-size="56" font-weight="800" letter-spacing="-2" fill="#E3D0FB">Good engineering earns trust.</text>
<rect x="72" y="230" width="430" height="64" rx="32" fill="url(#gold)"/>
<text x="287" y="270" text-anchor="middle" font-size="24" font-weight="700" fill="#2E1A05">Let's build something useful</text>
</g>
</svg>